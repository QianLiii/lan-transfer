# M0 的 CI：三个平台各自「构建 + ctest」。
#
# macOS 那一格是刻意的可移植性探针（§9 M0）：它的作用是尽早暴露 Clang 差异、
# 非可移植的 API 用法，以及 Apple 平台上没有系统 OpenSSL 这件事——
# 而不是等到 M7 才发现。
#
# 这个 workflow 是 M0 的主要产出之一：它第一次证明 §2.5 那条「三个平台都能找到
# OpenSSL 3」成立。首次运行如果某一格红了，先看 CMake 输出的
# "Found OpenSSL" 那一行，再动下面的路径。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送会取消尚未跑完的旧任务，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 一格的失败不应掩盖其它格的结果——第一次跑的时候，
      # 「哪些平台能过」本身就是我们要收集的信息。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 与 TECHNICAL_ROUTE.md §2.1 一致：跟随 6.11 线，不锁 LTS 分支。
          version: '6.11.2'
          cache: true
          # 这里刻意不装 modules：M0 只需要 qtbase（Core / Network / Test）。
          # qtdeclarative（Quick）到 M5 才需要，届时加 modules: qtdeclarative。

      # Linux 不需要额外步骤：ubuntu-latest 自带 OpenSSL 3 开发头文件与 ninja。
      # 若某天这一格因为找不到 OpenSSL 而失败，错误信息会是
      # "Could NOT find OpenSSL"，届时在这里补 apt 安装。

      - name: 准备 OpenSSL（macOS）
        if: runner.os == 'macOS'
        run: |
          # 系统不自带 OpenSSL，这也是 Qt 在 Apple 平台默认走 SecureTransport 的原因。
          # 用 brew --prefix 而不是硬编码 /opt/homebrew，兼容 Intel 与 Apple Silicon。
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: 准备 OpenSSL（Windows）
        if: runner.os == 'Windows'
        run: |
          choco install openssl --no-progress -y
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" >> "$env:GITHUB_ENV"

      - name: 配置
        run: cmake --preset ci
        env:
          # install-qt-action 通过 $GITHUB_ENV 设置 QT_ROOT_DIR，
          # 后续步骤以 ${{ env.QT_ROOT_DIR }} 取用。
          #
          # 如果这一格报 "Could not find a package configuration file provided by Qt6"，
          # 唯一需要检查的就是这个变量名：在配置步骤前临时加一句
          # `run: env | grep -i qt` 打印实际名字即可。
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: 构建
        run: cmake --build --preset ci

      - name: 测试
        run: ctest --preset ci

      # M0 的第三条验收：CLI 可 headless 运行。
      # 用 bash 是为了三个平台共用一条命令（Windows 上是 Git Bash）。
      - name: CLI 冒烟测试
        shell: bash
        run: |
          exe=build/ci/cli/lanpipe
          [ "${RUNNER_OS}" = "Windows" ] && exe="${exe}.exe"
          "$exe" --version
