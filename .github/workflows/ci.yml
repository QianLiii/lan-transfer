# M0 的 CI：三个平台各自「构建 + ctest」。
#
# macOS 那一格是刻意的可移植性探针（§9 M0）：它的作用是尽早暴露 Clang 差异、
# 非可移植的 API 用法，以及 Apple 平台上没有系统 OpenSSL 这件事——
# 而不是等到 M7 才发现。
#
# 这个 workflow 是 M0 的主要产出之一：它第一次证明 §2.5 那条「三个平台都能找到
# OpenSSL 3」成立。首次运行如果某一格红了，先看 CMake 输出的
# "Found OpenSSL" 那一行，再动下面的路径。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送会取消尚未跑完的旧任务，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # 一格的失败不应掩盖其它格的结果——第一次跑的时候，
      # 「哪些平台能过」本身就是我们要收集的信息。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      # 先把 Python 固定下来，再让 Qt action 用它。
      #
      # install-qt-action 默认（setup-python: true）会自己跑 actions/setup-python，
      # 在 Windows runner 上挑到 hostedtoolcache 里最新的 3.14.7。而它内部钉住的
      # aqtinstall 3.3.x + py7zr 1.1.0 在这套 Python 上跑不起来，表现是 aqtinstall
      # 以 exit 1 退出、且具体错误只留在日志里（注解只报退出码）。
      # Linux runner 挑到的 Python 更旧，所以同一个 action 只有 Windows 挂。
      #
      # 3.12 是三个 runner 的 hostedtoolcache 里都有的版本。
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装 Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 与 TECHNICAL_ROUTE.md §2.1 一致：跟随 6.11 线，不锁 LTS 分支。
          version: '6.11.2'
          cache: true
          # 关掉它自己的 Python 选择，改用上面钉住的 3.12。
          setup-python: false
          # 从 git 装 aqtinstall，而不是用 PyPI 上的发布版。
          #
          # 原因：PyPI 上最新是 2025-06-02 的 3.3.0，而 Qt 自 6.11.0（2026-03-23）
          # 起改了 Windows 的仓库布局——架构目录从
          #   <平台>/desktop/qt6_6112/qt6_6112/Updates.xml
          # 变成
          #   <平台>/desktop/qt6_6112/qt6_6112_msvc2022_64/Updates.xml
          # 3.3.0 不认识新布局，于是在 Windows 上拼出一个 404 的路径，
          # 报 "Failed to locate XML data for Qt version '6.11.2'"。
          # Linux 的布局没变，所以同一个 action 只有 Windows 挂。
          #
          # 修复（aqtinstall #959 / #1000）已并入 master 但尚未发版，
          # 因此这里直接指向 master。上游若出现回归，把 @master 换成一个
          # 具体提交 SHA 即可——aqtsource 的值是原样交给 pip 的。
          aqtsource: 'aqtinstall @ git+https://github.com/miurahr/aqtinstall@master'
          # 这里刻意不装 modules：M0 只需要 qtbase（Core / Network / Test）。
          # qtdeclarative（Quick）到 M5 才需要，届时加 modules: qtdeclarative。

      # Linux 不需要额外步骤：ubuntu-latest 自带 OpenSSL 3 开发头文件与 ninja。
      # 若某天这一格因为找不到 OpenSSL 而失败，错误信息会是
      # "Could NOT find OpenSSL"，届时在这里补 apt 安装。

      - name: 准备 OpenSSL（macOS）
        if: runner.os == 'macOS'
        run: |
          # 系统不自带 OpenSSL，这也是 Qt 在 Apple 平台默认走 SecureTransport 的原因。
          # 用 brew --prefix 而不是硬编码 /opt/homebrew，兼容 Intel 与 Apple Silicon。
          brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_ROOT_DIR=$prefix" >> "$GITHUB_ENV"
          # 上面那一行只解决编译期（我们的 find_package 和链接）。
          # Qt 的 openssl 后端插件是在**运行时** dlopen libssl/libcrypto 的，
          # 而 brew 的 openssl 是 keg-only，不在 dyld 的默认搜索路径上——
          # 不设这一行，插件加载不到库，supportsSsl() 为假，程序会以退出码 3 拒绝启动。
          echo "DYLD_FALLBACK_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - name: 准备 OpenSSL（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # runner 镜像已预装 win64-openssl（完整的，含头文件与 .lib），
          # 路径见 actions/runner-images 的 Install-OpenSSL.ps1：
          #   $installDir = "$env:ProgramFiles\OpenSSL"
          # 不需要 choco——而且 choco 的 openssl 包装到 OpenSSL-Win64，
          # 与镜像自带的这份位置不同，之前就是照着包名猜错了路径。
          $root = Join-Path $env:ProgramFiles 'OpenSSL'
          if (-not (Test-Path $root)) {
            throw "未找到 OpenSSL：$root（runner 镜像变更？）"
          }
          Write-Host "OPENSSL_ROOT_DIR=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$root"

      # Windows 上必须先把 MSVC 环境准备好。
      #
      # 用 Ninja 生成器时，CMake 从 PATH 上找编译器，而 windows runner 的
      # C:\mingw64\bin 在 PATH 里，于是会挑到 MinGW 的 g++。但我们装的 Qt 是
      # win64_msvc2022_64（MSVC ABI），两者不能链接。
      # 这一步把 cl.exe 放进 PATH，Ninja 就会用到 MSVC。
      - name: 准备 MSVC 环境（Windows）
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: 配置
        run: cmake --preset ci
        env:
          # install-qt-action 通过 $GITHUB_ENV 设置 QT_ROOT_DIR，
          # 后续步骤以 ${{ env.QT_ROOT_DIR }} 取用。
          #
          # 如果这一格报 "Could not find a package configuration file provided by Qt6"，
          # 唯一需要检查的就是这个变量名：在配置步骤前临时加一句
          # `run: env | grep -i qt` 打印实际名字即可。
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}

      - name: 构建
        run: cmake --build --preset ci

      - name: 测试
        run: ctest --preset ci

      # ctest 只在失败时打印子进程输出，跳过的用例连一行都不打——CI 里只剩
      # ***Skipped，看不出为什么。原因与进度标记都在 LastTest.log 里，这里捞一遍。
      # `|| true` 不能省：GitHub 的 bash 步骤是 set -e，grep 无匹配会返回 1。
      - name: 打印测试留下的标记与跳过原因
        if: always()
        shell: bash
        run: |
          log=build/ci/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          grep -hE '\[tst_|SKIP!' "$log" || true

      # M0 的第三条验收：CLI 可 headless 运行。
      # 用 bash 是为了三个平台共用一条命令（Windows 上是 Git Bash）。
      - name: CLI 冒烟测试
        shell: bash
        run: |
          exe=build/ci/cli/lanpipe
          [ "${RUNNER_OS}" = "Windows" ] && exe="${exe}.exe"
          "$exe" --version
